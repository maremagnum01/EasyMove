{% extends 'core/base.html' %} {% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm p-4 border-0 bg-light">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>

        <form method="post">
          {% csrf_token %}

          <!-- Renderizamos el formulario de Django -->
          {{ form.as_p }}

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary btn-lg">
              Ingresar
            </button>
          </div>
        </form>

        <div class="text-center mt-3">
          <p class="mb-0">¿No tienes cuenta?</p>
          <a href="{% url 'registro_cliente' %}" class="text-decoration-none"
            >Me quiero mudar</a
          >
          |
          <a href="{% url 'registro_empresa' %}" class="text-decoration-none"
            >Realizo mudanzas</a
          >
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
