{% extends 'core/base.html' %} {% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm p-4">
        <h2 class="text-center mb-4">Registro de {{ tipo }}</h2>
        <form method="post">
          {% csrf_token %}
          <!-- Renderizamos el formulario con estilos básicos de bootstrap -->
          {{ form.as_p }}

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary btn-lg">
              Crear Cuenta
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
